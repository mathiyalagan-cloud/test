apiVersion: apps/v1
kind: Deployment
metadata:
  name: maven-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maven-app
  template:
    metadata:
      labels:
        app: maven-app
    spec:
      containers:
      - name: maven-app
        image: mathi784/maven-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
